# Honeypot server configuration (development defaults).
# Production copy lives in /etc/honeypot-server/server.properties (see deploy/).

server.bind=0.0.0.0
server.port=8443

# HTTPS is mandatory: the C agent verifies the TLS chain and the receiver IP in
# the certificate SAN, and that cannot be turned off agent-side. Generate the
# keystore (and the CA the agent must trust) with scripts/gen-certs.sh.
server.keystore=certs/server-keystore.p12
server.keystore.password=changeit

# Directory for the JSON Lines report log (events.jsonl). Created on start.
data.dir=data

# Static dashboard served from the same origin (no CORS). Leave empty or point
# to a missing directory to disable serving it from here.
dashboard.dir=../dashboard
