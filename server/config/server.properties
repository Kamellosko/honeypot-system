# Honeypot server configuration (development defaults).
# Production copy lives in /etc/honeypot-server/server.properties (see deploy/).

server.bind=0.0.0.0
server.port=8000

# SQLite database file. Parent directory is created on start.
db.path=data/honeypot.db

# Load src/main/resources/db/seed.sql (sensor-01) on start.
db.seed=true
