# Honeypot server configuration (development defaults).
# Production copy lives in /etc/honeypot-server/server.properties (see deploy/).

server.bind=0.0.0.0
server.port=8000

# Pre-provisioned sensors (read at startup).
sensors.file=config/sensors.json

# Directory for the JSON Lines report logs (events/heartbeats/errors).
# Created on start.
data.dir=data
